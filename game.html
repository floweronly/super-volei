:root {
  --sea: #0b3a49;
  --sea-deep: #072630;
  --sand: #e8cf9a;
  --line: #fffdf3;
  --you: #ff6a4d;
  --cpu: #3b4fb8;
  --font-display: "Bungee", "Impact", sans-serif;
  --font-body: "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--sea-deep);
  color: var(--line);
  font-family: var(--font-body);
  padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  overflow: hidden;
  overscroll-behavior: none;
}
#stage { flex: 1; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
#wrap { position: relative; border-radius: 14px; overflow: hidden; background: var(--sea); }
#gl, #ui { position: absolute; left: 0; top: 0; display: block; }
#gl { pointer-events: none; }
#ui { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }

  // ---------- pose dos personagens ----------
  function angDiff(a, b) { var d = (a - b) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; }
  function poseChar(o, c, dt) {
    var moved = Math.hypot(c.rx - o.px, c.ry - o.py); o.px = c.rx; o.py = c.ry;
    var speed = dt > 0 ? moved / dt : 0, amp = clamp(speed / 3.2, 0, 1);
    o.ph += speed * dt * 2.4;
    var diving = c.dive > 0, lying = diving && c.dive <= DIVE_LAY, air = c.z > 0.2, rising = diving && c.dive <= 12;

    // direção que o personagem olha
    var tgt;
    if (diving) tgt = Math.atan2(c.ddx, c.ddy);
    else {
      var bx = ball.rx - c.rx, by = ball.ry - c.ry;
      tgt = Math.hypot(bx, by) > 0.3 ? Math.atan2(bx, by) : o.ang;
      // mantém o rosto mais ou menos virado pra rede
      var base = c.team === 'p' ? Math.PI : 0, off = angDiff(tgt, base);
      tgt = base + clamp(off, -1.5, 1.5);
    }
    o.ang += angDiff(tgt, o.ang) * (diving ? 0.5 : 0.22);

    var aL = -0.3, aR = -0.3, lL = 0, lR = 0, pitch = 0, by2 = 0, bz2 = 0;
    var sw = Math.sin(o.ph) * 0.75 * amp;
    lL = sw; lR = -sw; aL += -sw * 0.7; aR += sw * 0.7;
    pitch = 0.1 * amp;
    o.pd = c.dive;
    if (diving) {
      var tf = clamp((DIVE_START - c.dive) / 16, 0, 1);               // 0..1 durante o voo
      if (!lying) {
        // decolagem -> corpo esticado na horizontal, braços à frente, pernas atrás
        var e = 1 - (1 - tf) * (1 - tf);
        pitch = 0.2 + e * 1.3; by2 = 0.1 + Math.sin(tf * Math.PI) * 0.6; bz2 = -0.1 - e * 0.65;
        aL = aR = -2.9 - e * 0.2; lL = 0.2 + e * 0.55; lR = e * 0.3;
      } else {
        pitch = 1.52; by2 = 0.18; bz2 = -0.78; aL = aR = -3.1; lL = 0.3; lR = 0.12;   // de peito na areia
      }
      if (rising) {                                                       // levantando da areia
        var up = c.dive / 12;
        pitch = 0.3 + up * 0.8; by2 = 0.1 + up * 0.08; bz2 = -0.2 - up * 0.45; aL = aR = -1.3 - up * 1.4; lL = 0.9; lR = -0.3;
      }
    } else if (c.block > 0) { aL = aR = -3.05; lL = 0.2; lR = -0.1; pitch = 0; }
    else if (c.swing > 0) {
      if (air || ball.z > c.z + 1.6) { aR = -2.75; aL = -0.7; pitch = -0.1; }
      else { aL = aR = -1.15; pitch = 0.3; lL = 0.25; lR = -0.25; }
    } else if (air) { aL = aR = -2.7; lL = 0.35; lR = -0.2; }
    else if (phase === 'ready' && c.team === 'p' && srv === 'c' && c.y > NETY) { aL = aR = -1.0; pitch = 0.15; }

    var k = diving ? 0.5 : 0.3, kp = diving ? 0.45 : 0.25;
    o.aL += (aL - o.aL) * k; o.aR += (aR - o.aR) * k; o.lL += (lL - o.lL) * k; o.lR += (lR - o.lR) * k;
    o.pitch += (pitch - o.pitch) * kp; o.by += (by2 - o.by) * (diving ? 0.5 : 0.3); o.bz += (bz2 - o.bz) * (diving ? 0.5 : 0.3);
    o.armL.rotation.x = o.aL; o.armR.rotation.x = o.aR; o.legL.rotation.x = o.lL; o.legR.rotation.x = o.lR;
    o.body.rotation.x = o.pitch; o.body.position.y = o.by; o.body.position.z = o.bz;
    o.root.rotation.y = o.ang;
    o.root.position.set(c.rx - 4.5, c.rz, c.ry - 9);
    var h = c.rz + (diving && !lying ? 0.8 : 0), sc = 1 / (1 + h * 0.45);
    o.shadow.position.set(c.rx - 4.5, 0.03, c.ry - 9); o.shadow.scale.set(sc, sc, sc); o.shadow.material.opacity = 0.9 * sc;
    if (o.marker) { o.marker.position.y = 2.45 + Math.sin(tick * 0.12) * 0.07; o.marker.visible = !diving; }   // a setinha some enquanto está deitado
  }

  // posições de desenho: interpola entre o passo anterior e o atual da física, pra ficar liso a 60 fps
  function snapPrev() {
    allP.forEach(function (c) { c.ppx = c.x; c.ppy = c.y; c.ppz = c.z; });
    ball.ppx = ball.x; ball.ppy = ball.y; ball.ppz = ball.z;
  }
  function interp(alpha) {
    allP.forEach(function (c) { c.rx = c.ppx + (c.x - c.ppx) * alpha; c.ry = c.ppy + (c.y - c.ppy) * alpha; c.rz = c.ppz + (c.z - c.ppz) * alpha; });
    ball.rx = ball.ppx + (ball.x - ball.ppx) * alpha; ball.ry = ball.ppy + (ball.y - ball.ppy) * alpha; ball.rz = ball.ppz + (ball.z - ball.ppz) * alpha;
  }

  // poeira de areia quando cai do mergulho
  var puffs = [];
  function spawnPuff(x, y, dx, dy) {
    if (!renderer) return;
    var n = 0;
    for (var i = 0; i < puffs.length && n < 12; i++) {
      var p = puffs[i]; if (p.life > 0) continue;
      var a = Math.random() * Math.PI * 2, sp = 0.6 + Math.random() * 1.6;
      p.life = p.max = 0.45 + Math.random() * 0.3;
      p.mesh.position.set(x - 4.5 + dx * 0.8, 0.12, y - 9 + dy * 0.8);
      p.vx = Math.cos(a) * sp + dx * 1.2; p.vy = 1.0 + Math.random() * 1.6; p.vz = Math.sin(a) * sp + dy * 1.2;
      p.mesh.visible = true; n++;
    }
  }
  function updatePuffs(dt) {
    for (var i = 0; i < puffs.length; i++) {
      var p = puffs[i]; if (p.life <= 0) continue;
      p.life -= dt; var k = clamp(p.life / p.max, 0, 1);
      p.vy -= 5 * dt; p.mesh.position.x += p.vx * dt; p.mesh.position.y = Math.max(0.05, p.mesh.position.y + p.vy * dt); p.mesh.position.z += p.vz * dt;
      p.vx *= 0.96; p.vz *= 0.96;
      var s = 0.6 + (1 - k) * 1.5; p.mesh.scale.set(s, s, s); p.mesh.material.opacity = 0.65 * k;
      if (p.life <= 0) p.mesh.visible = false;
    }
  }

  function updateCrowd(dt, now) {
    if (!crowdD) return;
    crowdE *= Math.exp(-Math.min(dt, 0.1) * 0.75);
    var e = crowdE;
    if (e < 0.02) { if (!crowdDirty) return; e = 0; crowdDirty = false; crowdE = 0; } else crowdDirty = true;
    var dm = crowdDum, t = now * 0.001;
    for (var i = 0; i < crowdD.length; i++) {
      var c = crowdD[i], j = Math.abs(Math.sin(t * 11 + c[4])) * 0.34 * e;
      dm.position.set(c[0], c[1] + 0.3 + j, c[2]); dm.rotation.set(0, c[3] + Math.sin(t * 9 + c[4]) * 0.3 * e, Math.sin(t * 7 + c[4] * 2) * 0.12 * e); dm.updateMatrix(); crowdB.setMatrixAt(i, dm.matrix);
      dm.position.set(c[0], c[1] + 0.7 + j * 1.2, c[2]); dm.rotation.set(0, 0, 0); dm.updateMatrix(); crowdH.setMatrixAt(i, dm.matrix);
    }
    crowdB.instanceMatrix.needsUpdate = true; crowdH.instanceMatrix.needsUpdate = true;
  }
  function updateFans(now) {
    var t = now * 0.001;
    fans.forEach(function (f, i) {
      var act = (i === fanIdx) ? fanK : 0, ch = Math.max(act, crowdE * 0.65), w = Math.sin(t * 13 + i * 1.7);
      f.arms[0].rotation.z = -(0.15 + ch * (2.45 + w * 0.4)); f.arms[1].rotation.z = 0.15 + ch * (2.45 - w * 0.4);
      f.g.position.y = f.d.y + Math.abs(Math.sin(t * 9 + i)) * 0.18 * ch;
      f.head.rotation.z = Math.sin(t * 8 + i) * 0.22 * ch; f.head.rotation.x = -0.1 * act;
      f.mouth.scale.y = 1 + ch * (0.9 + Math.sin(t * 20) * 0.4); f.mouth.scale.x = 1.2 + ch * 0.4;
      f.sign.rotation.z = Math.sin(t * 7 + i) * 0.2 * ch; f.sign.position.y = -0.2 + ch * 0.12;
    });
  }
  function render3D(dt, now, alpha) {
    if (!renderer) return;
    interp(alpha);
    updatePuffs(dt);
    // personagens: 0=c1 1=c2 2=parceiro 3=você
    poseChar(chars[0], c1, dt); poseChar(chars[1], c2, dt); poseChar(chars[2], mate, dt); poseChar(chars[3], pl, dt);

    ballMesh.position.set(ball.rx - 4.5, ball.rz + 0.22, ball.ry - 9);
    var spin = ball.wob ? 0.12 : 1;     // saque flutuante quase não gira

    ctx.fillStyle = 'rgba(255,253,243,.85)'; ctx.font = '26px Bungee, Impact, sans-serif'; ctx.fillText('‹', r.x + 22, r.y + 36); ctx.fillText('›', r.x + r.w - 22, r.y + 36);
  }
  function drawJersey(x, y, sz, shirt, shorts) {
    var u = sz / 10;
    ctx.fillStyle = shorts; ctx.fillRect(x + 2.6 * u, y + 6.2 * u, 4.8 * u, 3.4 * u);
    ctx.fillStyle = shirt; ctx.beginPath();
    ctx.moveTo(x + 3 * u, y); ctx.lineTo(x + 7 * u, y); ctx.lineTo(x + 10 * u, y + 2.2 * u); ctx.lineTo(x + 8.6 * u, y + 4.2 * u); ctx.lineTo(x + 7.4 * u, y + 3.4 * u);
    ctx.lineTo(x + 7.4 * u, y + 6.6 * u); ctx.lineTo(x + 2.6 * u, y + 6.6 * u); ctx.lineTo(x + 2.6 * u, y + 3.4 * u); ctx.lineTo(x + 1.4 * u, y + 4.2 * u); ctx.lineTo(x, y + 2.2 * u); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  function tsel(r, label, ti, accent) {
    var T = TEAMS[ti];
    ctx.fillStyle = 'rgba(8,24,44,.88)'; rr(r.x, r.y, r.w, r.h, 16); ctx.fill();
    ctx.strokeStyle = accent; ctx.lineWidth = 3; ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = accent; ctx.font = '900 11px Nunito, sans-serif'; ctx.fillText(label, r.x + r.w / 2, r.y + 20);
    drawJersey(r.x + 52, r.y + 32, 48, T.s, T.p);
    ctx.fillStyle = '#fffdf3'; ctx.font = '22px Bungee, Impact, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(T.n, r.x + 112, r.y + 62); ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,253,243,.85)'; ctx.font = '30px Bungee, Impact, sans-serif'; ctx.fillText('‹', r.x + 22, r.y + 62); ctx.fillText('›', r.x + r.w - 22, r.y + 62);
  }
  function drawTeams() {
    var R2 = mrects(), g;
    g = ctx.createLinearGradient(0, 0, landscape ? W : 0, landscape ? 0 : H);
    if (landscape) { g.addColorStop(0, 'rgba(5,12,24,.35)'); g.addColorStop(0.5, 'rgba(5,12,24,.55)'); g.addColorStop(1, 'rgba(5,12,24,.88)'); }
    else { g.addColorStop(0, 'rgba(5,12,24,.55)'); g.addColorStop(0.3, 'rgba(5,12,24,.1)'); g.addColorStop(0.45, 'rgba(5,12,24,.75)'); g.addColorStop(1, 'rgba(5,12,24,.94)'); }
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
    ctx.font = '28px Bungee, Impact, sans-serif'; ctx.lineWidth = 7; ctx.strokeStyle = '#0a1a33'; ctx.fillStyle = '#ffe08a';
    var tx = landscape ? 170 : W / 2, ty = landscape ? 150 : 110;
    ctx.strokeText('ESCOLHA', tx, ty); ctx.fillText('ESCOLHA', tx, ty); ctx.strokeText('O TIME', tx, ty + 36); ctx.fillText('O TIME', tx, ty + 36);
    tsel(R2.tme, 'SEU TIME', cfg.me, '#ff9a7c'); tsel(R2.top, 'ADVERSÁRIO', cfg.op, '#9fb0ff');
    var pu = 1 + Math.sin(menuT * 0.006) * 0.02, pr = R2.tgo;
    ctx.save(); ctx.translate(pr.x + pr.w / 2, pr.y + pr.h / 2); ctx.scale(pu, pu); ctx.translate(-pr.x - pr.w / 2, -pr.y - pr.h / 2);
    mbtn(pr, '#e5533a', 'COMEÇAR', ''); ctx.restore();
    mbtn(R2.tbk, '#1f9a92', 'VOLTAR', '');
  }
  function drawMenu() {
    var R2 = mrects(), g;
    // escurece o fundo (a quadra gira atrás)
    g = ctx.createLinearGradient(0, 0, landscape ? W : 0, landscape ? 0 : H);
    if (landscape) { g.addColorStop(0, 'rgba(5,12,24,.78)'); g.addColorStop(0.55, 'rgba(5,12,24,.45)'); g.addColorStop(1, 'rgba(5,12,24,.8)'); }
    else { g.addColorStop(0, 'rgba(5,12,24,.7)'); g.addColorStop(0.4, 'rgba(5,12,24,.35)'); g.addColorStop(0.62, 'rgba(5,12,24,.78)'); g.addColorStop(1, 'rgba(5,12,24,.92)'); }
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (showHelp) { drawHelp(R2); return; }
    var tx = landscape ? 170 : W / 2, ty = landscape ? 120 : 130, bob = Math.sin(menuT * 0.003) * 4;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
    ctx.font = '22px Bungee, Impact, sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText('S U P E R', tx, ty - 34);
    ctx.font = (landscape ? 64 : 72) + 'px Bungee, Impact, sans-serif';
    g = ctx.createLinearGradient(0, ty - 50, 0, ty + 20); g.addColorStop(0, '#ffe08a'); g.addColorStop(1, '#ff6a4d');
    ctx.lineWidth = 9; ctx.strokeStyle = '#0a1a33'; ctx.strokeText('VÔLEI', tx, ty + 24 + bob); ctx.fillStyle = g; ctx.fillText('VÔLEI', tx, ty + 24 + bob);
    ctx.font = '15px Bungee, Impact, sans-serif'; ctx.fillStyle = '#9fd0ff'; ctx.fillText('2 × 2  ·  QUADRA', tx, ty + 56);
    // bolinha animada
    var bx = tx + (landscape ? 118 : 128), by = ty - 8 + Math.abs(Math.sin(menuT * 0.004)) * -14;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bx, by, 14, 0, 7); ctx.fill();
    ctx.strokeStyle = '#2b7fd1'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(bx, by, 14, 0.4, 2.2); ctx.stroke();
    ctx.strokeStyle = '#f2c14e'; ctx.beginPath(); ctx.arc(bx, by, 14, 3.5, 5.3); ctx.stroke();
    var pu = 1 + Math.sin(menuT * 0.006) * 0.025, pr = R2.play;
    ctx.save(); ctx.translate(pr.x + pr.w / 2, pr.y + pr.h / 2); ctx.scale(pu, pu); ctx.translate(-pr.x - pr.w / 2, -pr.y - pr.h / 2);
    mbtn(pr, '#e5533a', 'JOGAR', ''); ctx.restore();
    msel(R2.diff, 'DIFICULDADE', DIFFS[cfg.diff]);
    msel(R2.pts, 'PONTOS PARA VENCER', String(cfg.pts));
    mbtn(R2.help, '#1f9a92', 'COMO JOGAR', '');
    drawOta(R2.ota);
  }
  function drawOta(r) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(255,253,243,.55)'; ctx.font = '900 10px Nunito, sans-serif'; ctx.fillText('v' + GAME_VERSION, landscape ? W - 22 : W / 2, landscape ? H - 8 : H - 10);
    if (!ota.shell) return;
    if (ota.state === 'idle' && screen === 'menu') otaCheck();
    var st2 = ota.state, msg = null;
    if (st2 === 'available') { mbtn(r, '#2e9e4f', 'ATUALIZAR PARA v' + ota.remote, ota.notes ? ota.notes.slice(0, 46) : 'toque para baixar'); return; }
    if (st2 === 'checking' || st2 === 'idle') msg = 'verificando atualização…';
    else if (st2 === 'downloading') msg = 'baixando atualização…';
    else if (st2 === 'ready') msg = 'pronto! reiniciando…';
    else if (st2 === 'uptodate') msg = 'jogo atualizado ✓';
    else msg = 'sem conexão · toque pra tentar de novo';
    ctx.fillStyle = st2 === 'error' ? '#ffb4a8' : 'rgba(255,253,243,.8)'; ctx.font = '900 12px Nunito, sans-serif'; ctx.fillText(msg, r.x + r.w / 2, r.y + r.h / 2 + 4);
  }
  function drawHelp(R2) {
    var x = 24, y = landscape ? 14 : 70, w = W - 48, h = landscape ? 276 : 430;
    ctx.fillStyle = 'rgba(8,24,44,.94)'; rr(x, y, w, h, 18); ctx.fill(); ctx.strokeStyle = 'rgba(255,253,243,.5)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffd36b'; ctx.font = '20px Bungee, Impact, sans-serif'; ctx.fillText('COMO JOGAR', W / 2, y + 34);
    var L = [['ANALÓGICO', 'anda pela quadra'], ['PULAR', 'salta (devagar pra voltar)'], ['ATAQUE', 'toque = fraco · segure = forte; pulo e corrida somam força'],
      ['DIVE', 'no 1º toque (depois do saque) você se joga'], ['LEVANTAR', 'depois do 1º toque, levanta pro parceiro'],
      ['SAQUE', 'escolha Viagem ou Flutuante e toque na zona verde']];
    var ly = y + (landscape ? 58 : 72), step = landscape ? 33 : 56;
    L.forEach(function (it, i) {
      ctx.textAlign = 'left'; ctx.fillStyle = '#ff9a7c'; ctx.font = '13px Bungee, Impact, sans-serif'; ctx.fillText(it[0], x + 18, ly + i * step);
      ctx.fillStyle = 'rgba(255,253,243,.9)'; ctx.font = '900 12px Nunito, sans-serif';
      if (landscape) ctx.fillText(it[1], x + 120, ly + i * step); else ctx.fillText(it[1], x + 18, ly + i * step + 18);
    });
    mbtn(R2.back, '#e5533a', 'VOLTAR', '');
  }
  function drawPauseBtn() {
    var r = mrects().pause;
    ctx.fillStyle = 'rgba(8,24,44,.7)'; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,253,243,.7)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fffdf3'; var b = r.r * 0.3; ctx.fillRect(r.x - b * 1.5, r.y - b * 1.5, b, b * 3); ctx.fillRect(r.x + b * 0.5, r.y - b * 1.5, b, b * 3);
  }
  function drawPause() {
    var R2 = mrects();
    ctx.fillStyle = 'rgba(5,12,24,.72)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.fillStyle = '#fffdf3'; ctx.font = '30px Bungee, Impact, sans-serif'; ctx.fillText('PAUSADO', W / 2, R2.resume.y - 24);
    mbtn(R2.resume, '#e5533a', 'CONTINUAR', ''); mbtn(R2.quit, '#1f9a92', 'MENU', '');
  }
  function drawOver() {
    var R2 = mrects();
    mbtn(R2.again, '#e5533a', 'JOGAR DE NOVO', ''); mbtn(R2.menu, '#1f9a92', 'MENU', '');
  }

  function drawSplash() {
    if (splashT0 < 0) splashT0 = menuT;
    var t = menuT - splashT0, k = Math.min(1, t / 700), out = clamp((t - (SPLASH_MS - 450)) / 450, 0, 1);
    var cx = landscape ? W * 0.27 : W / 2, tcx = landscape ? W * 0.7 : W / 2, cy = landscape ? H * 0.46 : H * 0.4, g;
    g = ctx.createRadialGradient(cx, cy, 20, cx, cy, Math.hypot(W, H) * 0.7);
    g.addColorStop(0, '#ff8a4d'); g.addColorStop(0.45, '#d9344a'); g.addColorStop(1, '#2a0f4a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // raios de anime girando
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * 0.0003);
    for (var i = 0; i < 18; i++) {
      ctx.rotate(6.2832 / 18); ctx.fillStyle = i % 2 ? 'rgba(255,255,255,.10)' : 'rgba(255,225,120,.14)';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.hypot(W, H), -26); ctx.lineTo(Math.hypot(W, H), 26); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // retrato
    var ease = 1 - Math.pow(1 - k, 3), bounce = 1 + Math.sin(k * 3.14159) * 0.12, R0 = (landscape ? 108 : 118) * ease * bounce;
    if (R0 > 2) {
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.06 * (1 - k));
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(8, 12, R0 + 8, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, R0 + 8, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffd36b'; ctx.beginPath(); ctx.arc(0, 0, R0 + 3, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, R0, 0, 7); ctx.clip();
      if (FACE.complete && FACE.naturalWidth) ctx.drawImage(FACE, -R0, -R0, R0 * 2, R0 * 2);
      else { ctx.fillStyle = '#5aa8e6'; ctx.fillRect(-R0, -R0, R0 * 2, R0 * 2); }
      ctx.restore();
    }
    // título
    var ty = landscape ? H * 0.5 : H * 0.72, a = clamp((t - 500) / 400, 0, 1), sl = (1 - a) * 40;
    ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
    ctx.font = '22px Bungee, Impact, sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText('S U P E R', tcx - sl, ty - (landscape ? 60 : 56));
    ctx.font = (landscape ? 54 : 68) + 'px Bungee, Impact, sans-serif';
    var gg = ctx.createLinearGradient(0, ty - 50, 0, ty + 12); gg.addColorStop(0, '#ffe08a'); gg.addColorStop(1, '#ff6a4d');
    ctx.lineWidth = 9; ctx.strokeStyle = '#2a0f4a'; ctx.strokeText('VÔLEI', tcx + sl, ty); ctx.fillStyle = gg; ctx.fillText('VÔLEI', tcx + sl, ty);
    ctx.font = '13px Bungee, Impact, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillText('FEITO POR CELLO', tcx, ty + (landscape ? 22 : 30));
    ctx.restore();
    if (t > 1200 && Math.sin(t * 0.008) > -0.3) {
      ctx.textAlign = 'center'; ctx.font = '900 12px Nunito, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.fillText('toque para continuar', tcx, landscape ? ty + 70 : H - 40);
    }
    if (out > 0) { ctx.fillStyle = 'rgba(5,12,24,' + out + ')'; ctx.fillRect(0, 0, W, H); }
    if (t >= SPLASH_MS) { screen = 'menu'; }
  }

  function drawUI() {
    ctx.clearRect(0, 0, W, H);
    if (!renderer) {
      ctx.fillStyle = '#0b3a49'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fffdf3'; ctx.textAlign = 'center'; ctx.font = '900 14px Nunito, sans-serif';
      ctx.fillText('Não foi possível iniciar o 3D neste navegador.', W / 2, H / 2 - 8);
      ctx.fillText('Tente abrir em outro navegador.', W / 2, H / 2 + 14);
      return;
    }
    if (screen === 'splash') { drawSplash(); return; }
    if (screen === 'menu') { drawMenu(); return; }
    if (screen === 'teams') { drawTeams(); return; }
    if (cineK > 0.02) drawCineFx(false);
    drawHud(); drawControls();
    if (cineK > 0.02) drawCineFx(true);
    if (fanK > 0.02) drawFanFx();
    if (phase === 'over') drawOver(); else if (!paused) drawPauseBtn();
    if (paused) drawPause();
  }

  // ---------- entrada (multitoque) ----------
  function toLogical(e) {
    var r = ui.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  function inBtn(b, p) { return Math.hypot(p.x - b.x, p.y - b.y) < b.r + 6; }
  function inRect(b, p) { return p.x >= b.x - 4 && p.x <= b.x + b.w + 4 && p.y >= b.y - 4 && p.y <= b.y + b.h + 4; }

  ui.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    try { ui.setPointerCapture(e.pointerId); } catch (err) {}
    var p = toLogical(e);
    var MR = mrects();
    if (screen === 'splash') { screen = 'menu'; return; }
    if (screen === 'menu') {
      if (showHelp) { showHelp = false; return; }
      if (hit(MR.play, p)) { screen = 'teams'; applyTeams(); }
      else if (hit(MR.diff, p)) { cfg.diff = (cfg.diff + (p.x < MR.diff.x + MR.diff.w / 2 ? 2 : 1)) % 3; saveCfg(); }
      else if (hit(MR.pts, p)) { var pi = PTS.indexOf(cfg.pts) + (p.x < MR.pts.x + MR.pts.w / 2 ? 2 : 1); cfg.pts = PTS[pi % 3]; saveCfg(); }
      else if (hit(MR.help, p)) showHelp = true;
      else if (hit(MR.ota, p)) otaTap();
      return;
    }
    if (screen === 'teams') {
      var N = TEAMS.length;
      if (hit(MR.tme, p)) { cfg.me = (cfg.me + (p.x < MR.tme.x + MR.tme.w / 2 ? N - 1 : 1)) % N; if (cfg.me === cfg.op) cfg.op = (cfg.op + 1) % N; applyTeams(); saveCfg(); }
      else if (hit(MR.top, p)) { var step = p.x < MR.top.x + MR.top.w / 2 ? N - 1 : 1; cfg.op = (cfg.op + step) % N; if (cfg.op === cfg.me) cfg.op = (cfg.op + step) % N; applyTeams(); saveCfg(); }
      else if (hit(MR.tgo, p)) startMatch();
      else if (hit(MR.tbk, p)) screen = 'menu';
      return;
    }
    if (paused) { if (hit(MR.resume, p)) paused = false; else if (hit(MR.quit, p)) toMenu(); return; }
    if (phase === 'over') { if (hit(MR.again, p)) startMatch(); else if (hit(MR.menu, p)) toMenu(); return; }
    if (Math.hypot(p.x - MR.pause.x, p.y - MR.pause.y) < MR.pause.r + 10) {
      paused = true; st.id = null; atkQ = jumpQ = setQ = diveQ = false; BTN.atk.id = BTN.set.id = BTN.jmp.id = null; return;
    }
    var stickZone = landscape ? (p.x < 240 && p.y > 100) : (p.x < 175 && p.y > 380);
    if (serveStage === 'choose' && inRect(SBTN.v, p)) serveCmd = 'viagem';
    else if (serveStage === 'choose' && inRect(SBTN.f, p)) serveCmd = 'flut';
    else if (serveStage === 'meter' && !stickZone) serveCmd = 'hit';          // toque em qualquer lugar fora do analógico
    else if (serveStage === null && inBtn(BTN.atk, p)) { BTN.atk.id = e.pointerId; atkQ = true; }
    else if (serveStage === null && inBtn(BTN.jmp, p)) { BTN.jmp.id = e.pointerId; jumpQ = true; }
    else if (serveStage === null && inBtn(BTN.set, p)) { BTN.set.id = e.pointerId; setQ = true; }
    else if (st.id === null && stickZone) {
      st.id = e.pointerId;
      st.bx = landscape ? clamp(p.x, 60, 240) : clamp(p.x, 55, 175);
      st.by = landscape ? clamp(p.y, 150, 320) : clamp(p.y, 470, 600);
      st.kx = p.x; st.ky = p.y;
    }
  });
  ui.addEventListener('pointermove', function (e) {
    if (e.pointerId !== st.id) return;
    var p = toLogical(e); st.kx = p.x; st.ky = p.y;
  });
  function release(e) {
    if (e.pointerId === st.id) st.id = null;
    if (e.pointerId === BTN.atk.id) BTN.atk.id = null;
    if (e.pointerId === BTN.jmp.id) BTN.jmp.id = null;
    if (e.pointerId === BTN.set.id) BTN.set.id = null;
  }
  ui.addEventListener('pointerup', release);
  ui.addEventListener('pointercancel', release);
  ui.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // teclado (só pra testar no computador)
  var KM = { ArrowLeft: 'l', a: 'l', ArrowRight: 'r', d: 'r', ArrowUp: 'u', w: 'u', ArrowDown: 'd', s: 'd' };
  window.addEventListener('keydown', function (e) {
    if (KM[e.key]) { keys[KM[e.key]] = 1; e.preventDefault(); }
    else if (serveStage === 'choose' && (e.key === '1' || e.key === 'j')) serveCmd = 'viagem';
    else if (serveStage === 'choose' && (e.key === '2' || e.key === 'k')) serveCmd = 'flut';
    else if (serveStage === 'meter' && (e.key === ' ' || e.key === 'j' || e.key === 'z' || e.key === 'k' || e.key === 'Enter')) { serveCmd = 'hit'; e.preventDefault(); }
    else if (e.key === ' ') { jumpQ = true; e.preventDefault(); }
    else if (e.key === 'k' || e.key === 'x' || e.key === 'e' || e.key === 'l') { setQ = true; }
    else if (e.key === 'j' || e.key === 'z' || e.key === 'Enter') { if (screen === 'splash') screen = 'menu'; else if (screen === 'menu') { screen = 'teams'; applyTeams(); } else if (screen === 'teams') startMatch(); else if (phase === 'over') startMatch(); else atkQ = true; }
    else if (e.key === 'Escape' || e.key === 'p') { if (screen === 'game' && phase !== 'over') paused = !paused; }
  });
  window.addEventListener('keyup', function (e) {
    if (KM[e.key]) keys[KM[e.key]] = 0;
  });

  // ---------- loop ----------
  var STEP_MS = 1000 / 60;
  var last = performance.now(), acc = 0, lastDraw = 0;
  var rafGap = 16.7, rafN = 0, minGap = 0;          // mede a taxa da tela: em 120/144 Hz limita a 60 fps
  function frame(now) {
    requestAnimationFrame(frame);
    if (lastDraw) {
      var gap = now - lastDraw;
      if (rafN < 40 && gap < 40) { rafGap = rafN ? Math.min(rafGap, gap) : gap; rafN++; if (rafN === 40) minGap = rafGap < 12 ? 1000 / 60 - rafGap / 2 : 0; }
    }
    if (minGap && lastDraw && now - lastDraw < minGap) return;
    var dtr = Math.min(now - last, 100); last = now; lastDraw = now;
    acc += dtr * SPEED;
    var n = 0;
    if (screen !== 'game' || paused) acc = 0;
    menuT = now;
    while (acc >= STEP_MS && n++ < 5) { step(); acc -= STEP_MS; }
    if (acc > STEP_MS) acc = 0;
    render3D(dtr / 1000, now, clamp(acc / STEP_MS, 0, 1));
    drawUI();
  }
  initGL(); if (renderer) applyTeams();
  fit();
  resetServe('p');
  if (renderer) { camera.position.set(CAMP.px, CAMP.py, CAMP.pz); }
  requestAnimationFrame(frame);
})();
